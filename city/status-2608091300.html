  async function writeStatData (path, value) {
    try {
      if (typeof waitGlobalInitialized === 'function') await waitGlobalInitialized('Mvu');
      if (!window.Mvu) { console.error('[临空市] Mvu 不可用，无法写入'); return false; }
      var data = Mvu.getMvuData({ type: 'message', message_id: getCurrentMessageId() });
      if (!data) data = { stat_data: {} };
      if (!data.stat_data) data.stat_data = {};
      var parts = path.split('.');
      var obj = data.stat_data;
      for (var i = 0; i < parts.length - 1; i++) {
        if (!obj[parts[i]] || typeof obj[parts[i]] !== 'object') obj[parts[i]] = {};
        obj = obj[parts[i]];
      }
      obj[parts[parts.length - 1]] = value;
      await Mvu.replaceMvuData(data, { type: 'message', message_id: getCurrentMessageId() });
      return true;
    } catch (e) { console.error('[临空市] 写入失败', e); return false; }
  }
  async function saveEdits () {
    var edits = collectEdits();

    for (var i = 0; i < edits.length; i++) {

      var v = e.value;
      if (isArrayPath(e.path)) {
        v = String(e.value).split(/[、，,、\s]+/).filter(function (x) { return x; });
      } else if (/^\s*-?\d+(\.\d+)?\s*$/.test(v)) {
        v = Number(v);

      var r = await writeStatData(e.path, v);

    var modList = mods.列表 || {};
    $('pf-modlist').innerHTML = Object.keys(modList).length
      ? Object.keys(modList).map(function (k) { return '<span class="chip">' + esc(k) + '：' + esc((modList[k] || {}).类型) + ' <em style="opacity:.6">（' + esc((modList[k] || {}).位置) + '）</em></span>'; }).join('')
      : '';

    var items = pj.持有物 || {};
    $('pf-items').innerHTML = Object.keys(items).length
      ? '<div class="chips scroll">' + Object.keys(items).map(function (k) { return '<span class="chip">' + esc(k) + ' ×' + (num(items[k].数量) || 1) + '</span>'; }).join('') + '</div>'
      : '<div class="empty">暂无持有物</div>';
  }

  function barTrack (lbl, val, max, colorFn, desc) {
    return '<div class="track"><div class="row"><span class="lbl">' + lbl + '</span><div class="bar"><i style="width:' + pct(val) + ';background:' + colorFn(val) + '"></i></div><span class="val">' + num(val) + '/' + max + '</span></div>' + (desc ? '<div class="subtrack">' + desc + '</div>' : '') + '</div>';
  }
  function nodeCards (nodes, showDim) {
    if (!nodes) return '<div class="empty">尚未激活任何节点</div>';
    var keys = Object.keys(nodes).filter(function (k) { return nodes[k] && nodes[k].是否激活 === true; });
    if (!keys.length) return '<div class="empty">尚未激活任何节点</div>';
    return keys.map(function (k) {
      var nd = nodes[k];
      return '<div class="node"><div class="h"><b>✦ ' + esc(nd.名称 || k) + '</b><span class="t">阈值 ' + num(nd.阈值) + '</span>' +
        (showDim && nd.维度 ? '<span class="t">维度：' + esc(nd.维度) + '</span>' : '') +
        '<span class="badge">已激活</span></div>' +
        (nd.节点事件 ? '<div class="ev">事件：' + esc(nd.节点事件) + '</div>' : '') +
        (nd.心态变化 ? '<div class="ev">心态：' + esc(nd.心态变化) + '</div>' : '') + '</div>';
    }).join('');
  }
  function renderCorruption () {
    var a = arch();
    var form = a.魔化形态 || '';
    var mh = stageOf(MAHUA_TABLES, form, a.魔化度);
    var yh = yinhuaStage(a.淫化度);

    // ── 魔化卡 ──
    var mhHtml = '';
    if (editMode) {
      mhHtml += '<div class="row" style="margin-bottom:6px"><span class="lbl">魔化度</span>' + editField('主角.堕落档案.魔化度', a.魔化度 || 0, true) + '</div>' +
        '<div class="row" style="margin-bottom:6px"><span class="lbl">魔化形态</span>' + editSel('主角.堕落档案.魔化形态', form, DEMON_TYPES) + '</div>' +
        '<div class="edit-hint">魔化表现</div>' + editField('主角.堕落档案.魔化表现', a.魔化表现 || '');
    } else {
      mhHtml += barTrack('魔化度', a.魔化度, 100, barColor, '身体向 <b>' + esc(form || '未确定形态') + '</b> 魔族化');
      if (mh) {
        mhHtml += '<div class="stage-box"><div class="st">' + esc(mh.stage) + ' · 魔化度 ' + esc(mh.band) + '</div>' +
          '<div class="sb"><b>身体</b>：' + esc(mh.body) + '</div>' +
          '<div class="sb"><b>天赋</b>：' + esc(mh.talent) + '</div>' +
          '<div class="sb"><b>稳定性</b>：' + esc(mh.stable) + '</div></div>';
      } else if (a.魔化表现) {
        mhHtml += '<div class="stage-box"><div class="sb">' + esc(a.魔化表现) + '</div></div>';
      }
    }
    $('cor-mahua').innerHTML = mhHtml;
    // 魔化节点（并入魔化卡下方，避免过度分卡）
    $('cor-mahua').insertAdjacentHTML('beforeend', '<div style="margin-top:6px">' + nodeCards(a.魔化节点) + '</div>');

    // ── 淫化卡 ──
    var yhHtml = '';
    if (editMode) {
      yhHtml += '<div class="row" style="margin-bottom:6px"><span class="lbl">淫化度</span>' + editField('主角.堕落档案.淫化度', a.淫化度 || 0, true) + '</div>' +
        '<div class="edit-hint">淫化表现</div>' + editField('主角.堕落档案.淫化表现', a.淫化表现 || '');
    } else {
      yhHtml += barTrack('淫化度', a.淫化度, 100, eroColor, '身体淫乱化 + 原始力量被淫魔力替换');
      if (yh) {
        yhHtml += '<div class="stage-box"><div class="st">' + esc(yh.name) + ' · 淫化度 ' + esc(yh.band) + '</div>' +
          '<div class="sb"><b>身体/欲望</b>：' + esc(yh.body) + '</div>' +
          '<div class="sb"><b>力量替换</b>：' + esc(yh.power) + '</div></div>';
      } else if (a.淫化表现) {
        yhHtml += '<div class="stage-box"><div class="sb">' + esc(a.淫化表现) + '</div></div>';
      }
    }
    $('cor-yinhua').innerHTML = yhHtml;
    $('cor-yinhua').insertAdjacentHTML('beforeend', '<div style="margin-top:6px">' + nodeCards(a.淫化节点) + '</div>');

    // ── 堕落六维卡 ──
    var six = sixOf(a);
    var sixHtml = '<div class="six-grid">' + LIU.map(function (k) {
      var v = num(six[k]);
      return '<div class="six-item"><div class="nm">' + esc(k) + ' <em style="opacity:.7;font-style:normal">' + esc(LIU_DESC[k]) + '</em></div>' +
        '<div class="row">' + (editMode ? editField('主角.堕落档案.堕落六维.' + k, v, true) : '<div class="bar"><i style="width:' + pct(v) + ';background:' + barColor(v) + '"></i></div><span class="val">' + v + '</span>') + '</div></div>';
    }).join('') + '</div>';
    $('cor-six').innerHTML = sixHtml;
    $('cor-six').insertAdjacentHTML('beforeend', '<div style="margin-top:6px">' + nodeCards(a.恶堕节点, true) + '</div>');

    // ── 魔力转化卡 ──
    var mg = p().魔力 || {};
    var convNote = mg.转化 === '淫魔力'
      ? '原始力量已被淫魔力完全替换（淫化≥70）——净化变污染、治愈变侵蚀，力量味道已是魔族级别'
      : (mg.转化 && mg.转化 !== '无' ? '原始力量被淫魔力替换中（淫化≥40）——力量带上污染属性' : '原始力量纯净（淫化<40）——无转化');
    $('cor-magic').innerHTML =
      '<span class="k">当前转化</span><span class="v"><b style="color:' + convColor(mg.转化) + '">' + esc(mg.转化 || '无') + '</b></span>' +
      '<span class="k">说明</span><span class="v" style="font-size:12px;color:#a88cd6">' + esc(convNote) + '</span>';

    // ── 当前认知 ──
    $('cor-cognition').innerHTML = editMode
      ? editField('主角.堕落档案.当前认知', a.当前认知 || '')
      : (a.当前认知 ? '<pre style="font-size:12px;color:#a88cd6;white-space:pre-wrap;line-height:1.7;font-family:inherit">' + esc(a.当前认知) + '</pre>' : '<div class="empty">尚未记录心态认知</div>');

    // ── 欲望xp ──
    var xp = a.欲望xp || {};
    $('cor-xp').innerHTML = Object.keys(xp).length
      ? Object.keys(xp).map(function (k) { var x = xp[k]; return '<div class="node"><div class="h"><b>' + esc(x.名字 || k) + '</b><span class="t">开发程度：' + esc(x.开发程度 || '未开发') + '</span></div>' + (x.描述 ? '<div class="ev">' + esc(x.描述) + '</div>' : '') + '</div>'; }).join('')
      : '<div class="empty">尚未开发性癖</div>';

    // ── 淫纹印记 / 特殊项目 ──
    var merged = {};
    var mk = a.淫纹印记 || {}; Object.keys(mk).forEach(function (k) { merged[k] = mk[k]; });
    var sp = a.特殊项目 || {}; Object.keys(sp).forEach(function (k) { merged[k] = sp[k]; });
    $('cor-marks').innerHTML = Object.keys(merged).length
      ? Object.keys(merged).map(function (k) { var m = merged[k]; return '<div class="node"><div class="h"><b>' + esc(m.名字 || k) + '</b><span class="t">' + esc(m.类型) + '</span><span class="t">' + esc(m.状态) + '</span></div>' + (m.描述 ? '<div class="ev">' + esc(m.描述) + '</div>' : '') + '</div>'; }).join('')
      : '<div class="empty">尚无印记或特殊项目</div>';
  }

  function relTier (v) {
    v = num(v);
    if (v < 0) return { name: '敌对', color: '#e0707a' };
    if (v <= 20) return { name: '冷淡', color: '#8aa0c0' };
    if (v <= 50) return { name: '中立', color: '#9d6bff' };
    if (v <= 80) return { name: '友善', color: '#7bd0a0' };
    if (v <= 95) return { name: '亲密', color: '#e8c87a' };
    return { name: '挚爱', color: '#ff6b9d' };
  }
  function toggleRelDetail (btn) {
    var card = btn.parentNode;
    var detail = card.querySelector('.rel-detail');
    if (detail) {
      var open = detail.classList.toggle('open');
      btn.textContent = open ? '▲ 收起详情' : '▼ 展开详情';
    }
  }
  function relDetailHtml (r) {
    var parts = [];
    if (has(r.性格)) parts.push('<div><span class="dk">性格：</span>' + esc(r.性格) + '</div>');
    if (has(r.喜爱)) parts.push('<div><span class="dk">喜爱：</span>' + esc(r.喜爱) + '</div>');
    if (has(r.外貌)) parts.push('<div><span class="dk">外貌：</span>' + esc(r.外貌) + '</div>');
    if (has(r.着装)) parts.push('<div><span class="dk">着装：</span>' + esc(r.着装) + '</div>');
    if (has(r.心里话)) parts.push('<div><span class="dk">心里话：</span>' + esc(r.心里话) + '</div>');
    if (has(r.背景故事)) parts.push('<div><span class="dk">背景：</span>' + esc(r.背景故事) + '</div>');
    if (has(r.当前认知)) parts.push('<div><span class="dk">认知：</span>' + esc(r.当前认知) + '</div>');
    return parts.join('');
  }
  // 关系的堕落显示：魔化/淫化 双轨 + 堕落六维（紧凑）
  function relCorruptionHtml (name, r, edit) {
    var tracks =
      '<div class="row" style="margin-left:50px;width:calc(100% - 50px)"><span class="lbl" style="width:44px">魔化</span>' + (edit ? editField('关系列表.' + name + '.魔化度', r.魔化度 || 0, true) : '<div class="bar"><i style="width:' + pct(r.魔化度) + ';background:' + barColor(r.魔化度) + '"></i></div><span class="val">' + num(r.魔化度) + '</span>') + '</div>' +
      '<div class="row" style="margin-left:50px;width:calc(100% - 50px)"><span class="lbl" style="width:44px">淫化</span>' + (edit ? editField('关系列表.' + name + '.淫化度', r.淫化度 || 0, true) : '<div class="bar"><i style="width:' + pct(r.淫化度) + ';background:' + eroColor(r.淫化度) + '"></i></div><span class="val">' + num(r.淫化度) + '</span>') + '</div>';
    var six = sixOf(r);
    var sixLine = edit
      ? '<div class="six-grid" style="margin-top:6px">' + LIU.map(function (k) { return '<div class="six-item"><div class="nm">' + esc(k.slice(0, 2)) + '</div>' + editField('关系列表.' + name + '.堕落六维.' + k, six[k] || 0, true) + '</div>'; }).join('') + '</div>'
      : '<div class="subtrack" style="margin-left:50px">堕落六维：' + LIU.map(function (k) { return esc(k.slice(0, 2)) + ' ' + num(six[k]); }).join('　') + '</div>';
    return '<div class="track" style="margin-top:7px">' + tracks + '</div>' + sixLine;
  }
  // 关系/伙伴卡片主体
  function relCardHtml (name, r, edit) {
    var tier = relTier(r.好感度);
    var detail = relDetailHtml(r);
    var card = '<div class="card"><div class="rel"><div><div class="nm">✦ ' + esc(r.姓名 || name) + '<span class="rel-tier" style="background:rgba(0,0,0,0.3);color:' + tier.color + ';border:1px solid ' + tier.color + '">' + tier.name + '</span></div>' +
      '<div class="meta">' + esc(r.种族 || '?') + ' · ' + esc(r.所属组织 || '无') + ' · ' + esc(fmtList(r.身份)) + '</div>' +
      (r.关系标签 && r.关系标签.length ? '<div class="heart">' + esc(r.关系标签.join('、')) + '</div>' : '') + '</div>' +
      '<div class="fav"><div>好感度 <b style="color:' + favColor(r.好感度) + '">' + (edit ? editField('关系列表.' + name + '.好感度', r.好感度 || 0, true) : num(r.好感度)) + '</b></div></div></div>' +
      relCorruptionHtml(name, r, edit) +
      (detail ? '<div class="rel-detail-btn" onclick="toggleRelDetail(this)">▼ 展开详情</div><div class="rel-detail">' + detail + '</div>' : '') + '</div>';
    return card;
  }
  function renderParty () {
    var rel = stat.关系列表 || {};
    var keys = Object.keys(rel).filter(function (k) { return rel[k] && rel[k].在场 === true; });
    if (!keys.length) { $('party-list').innerHTML = '<div class="card"><div class="empty">暂无在场伙伴</div><div class="empty" style="font-size:11px">关系列表中标有「在场=true」的角色会出现在这里</div></div>'; return; }
    $('party-list').innerHTML = keys.map(function (name) { return relCardHtml(name, rel[name], editMode); }).join('');
  }
  function renderRelations () {
    var rel = stat.关系列表 || {};
    var keys = Object.keys(rel);
    if (!keys.length) { $('rel-list').innerHTML = '<div class="card"><div class="empty">暂无关系角色</div></div>'; return; }
    $('rel-list').innerHTML = keys.map(function (name) { return relCardHtml(name, rel[name], editMode); }).join('');
  }

  function renderQuests () {
    var qs = stat.任务列表 || {};
    var keys = Object.keys(qs);
    if (!keys.length) { $('q-list').innerHTML = '<div class="card"><div class="empty">暂无任务</div></div>'; return; }
    $('q-list').innerHTML = keys.map(function (name) {
      var q = qs[name] || {};
      return '<div class="card"><div class="kv">' +
        '<span class="k">任务</span><span class="v"><b>' + esc(name) + '</b> <span class="chip" style="margin-left:6px">' + esc(q.关注度 || '中') + '</span></span>' +
        '<span class="k">状态</span><span class="v">' + esc(q.状态 || '进行中') + '</span>' +
        '<span class="k">进展</span><span class="v">' + esc(q.进展 || '—') + '</span>' +
        '<span class="k">详情</span><span class="v">' + esc(q.详情 || '—') + '</span>' +
        '<span class="k">奖励</span><span class="v">' + esc(q.奖励 || '—') + '</span></div></div>';
    }).join('');
  }

  function erosionLabel (v) { v = num(v); if (v >= 90) return '沦陷边缘'; if (v >= 60) return '严重恶化'; if (v >= 40) return '暗流涌动'; if (v >= 20) return '轻度渗透'; return '基本安全'; }
  function renderCityErosion () {
    var city = stat.临空市 || {};
    var overall = num(city.侵蚀度);
    var sub = ['白塔区', '学园区', '工业区', '生活区', '林缘区', '远郊', '临光战队', '安保部', '魔女结社', '涤罪教团', '樱狐神社', '欢愉秘教', '魔王军'];
    var h = '<div class="six-grid">';
    h += '<div class="six-item" style="grid-column:1/-1"><div class="nm">临空市整体 · ' + esc(erosionLabel(overall)) + '</div>' +
      '<div class="row"><div class="bar"><i style="width:' + pct(overall) + ';background:' + barColor(overall) + '"></i></div><span class="val">' + overall + '</span></div>' +
      '<div class="desc">100=彻底沦陷 · 0=魔族被驱逐</div></div>';
    sub.forEach(function (k) {
      var v = num((city[k] || {}).侵蚀度);
      h += '<div class="six-item"><div class="nm">' + esc(k) + '</div><div class="row"><div class="bar"><i style="width:' + pct(v) + ';background:' + barColor(v) + '"></i></div><span class="val">' + v + '</span></div></div>';
    });
    h += '</div>';
    return h;
  }
  function renderIntel () {
    var info = stat.信息 || {};
    var keys = Object.keys(info);
    $('city-ero').innerHTML = renderCityErosion();
    if (!keys.length) { $('intel-list').innerHTML = '<div class="empty">暂无情报</div>'; return; }
    $('intel-list').innerHTML = keys.map(function (name) {
      var inf = info[name];
      var body = typeof inf === 'string' ? '：' + esc(inf) : (inf && inf.内容 ? '：' + esc(inf.内容) + (inf.来源 ? ' <em style="opacity:.7">（来源：' + esc(inf.来源) + '）</em>' : '') : '');
      return '<div class="intel-item"><b>✦ ' + esc(name) + '</b>' + body + '</div>';
    }).join('');
  }

  function renderNews () {
    var news = stat.新闻 || {};
    var cats = Object.keys(news);
    if (!cats.length) { $('news-list').innerHTML = '<div class="card"><div class="empty">暂无新闻</div></div>'; return; }
    $('news-list').innerHTML = cats.map(function (catName) {
      var cat = news[catName] || {};
      var inner = Object.keys(cat).map(function (k) {
        return '<div class="news-cat"><div class="cat">✧ ' + esc(k) + '</div><div class="line">' + esc(cat[k] || '—') + '</div></div>';
      }).join('');
      return '<div class="card"><h3>' + esc(catName) + '</h3>' + inner + '</div>';
    }).join('');
  }

  /* ══════════ 数据读取 ══════════ */
  function refresh () {
    try {
      var v = getVariables({ type: 'message', message_id: getCurrentMessageId() });
      stat = (v && v.stat_data) || {};
    } catch (e) { console.error('[临空市状态] 读取失败', e); stat = {}; }
    render();
  }

  /* ══════════ 初始化 ══════════ */
  function init () {
    setupCards();
    setTab('profile');
    refresh();
    if (typeof waitGlobalInitialized === 'function' && typeof eventOn === 'function') {
      try {
        eventOn(tavern_events.GENERATION_AFTER_COMMANDS, refresh);
        eventOn(tavern_events.MESSAGE_SENT, refresh);
      } catch (e) {}
    }
    setInterval(refresh, 15000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
