<!-- 临空市 · 守护者档案（纯原生 JS 自包含版——兼容 $('body').load() 注入，无外部 CDN 依赖） -->
<style>
  :root {
    --lk-bg: #150a2b; --lk-bg2: #1d0f3d; --lk-card: #241244; --lk-line: #4a2a7a;
    --lk-text: #f0e6ff; --lk-dim: #a88cd6; --lk-accent: #9d6bff; --lk-accent2: #7bd0a0;
    --lk-gold: #e8c87a; --lk-good: #4fd68a; --lk-warn: #e8b04a; --lk-bad: #e0707a; --lk-deep: #c04860;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #150a2b; font-family: "Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif; color: #f0e6ff; font-size: 14px; min-height: 100%; position: relative; overflow-x: hidden; }
  .starfield, .starfield-twi { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .starfield { background:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 25% 65%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 38% 32%, #e8d0ff, transparent), radial-gradient(1px 1px at 52% 78%, #fff, transparent),
      radial-gradient(1px 1px at 64% 15%, #fff, transparent), radial-gradient(2px 2px at 76% 48%, #d8a8ff, transparent),
      radial-gradient(1px 1px at 88% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 94% 25%, #e8d0ff, transparent),
      radial-gradient(1px 1px at 8% 88%, #fff, transparent), radial-gradient(1px 1px at 45% 8%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 90%, #d8a8ff, transparent), radial-gradient(1px 1px at 30% 45%, #fff, transparent),
      radial-gradient(1px 1px at 55% 55%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 5%, #fff, transparent),
      radial-gradient(1px 1px at 5% 40%, #e8d0ff, transparent), radial-gradient(1px 1px at 33% 85%, #fff, transparent),
      radial-gradient(2px 2px at 60% 35%, #fff, transparent), radial-gradient(1px 1px at 90% 60%, #fff, transparent),
      linear-gradient(180deg, #1a0d33 0%, #241147 45%, #160a2e 100%); }
  .starfield-twi { background:
      radial-gradient(1.5px 1.5px at 20% 25%, #fff, transparent), radial-gradient(2px 2px at 48% 68%, #c9a0ff, transparent),
      radial-gradient(1.5px 1.5px at 72% 30%, #fff, transparent), radial-gradient(2px 2px at 90% 75%, #ffd8ff, transparent),
      radial-gradient(1px 1px at 35% 92%, #fff, transparent), radial-gradient(1.5px 1.5px at 80% 12%, #d8a8ff, transparent);
      animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
  #app { max-width: 860px; margin: 0 auto; padding: 16px 16px 40px; position: relative; z-index: 1; min-height: 100vh; }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border: 1px solid rgba(157,107,255,0.35); border-radius: 12px;
    background: linear-gradient(135deg, rgba(157,107,255,0.14), rgba(214,107,255,0.06), rgba(30,15,61,0.6));
    box-shadow: 0 0 24px rgba(157,107,255,0.25); position: relative; overflow: hidden; }
  .head::before { content: '✦ ✧ ✦ ✧ ✦ ✧ ✦'; position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 8px; color: rgba(216,168,255,0.5); letter-spacing: 8px; animation: twinkle 3s ease-in-out infinite; }
  .head h1 { font-size: 18px; letter-spacing: 0.12em; color: #d8b0ff; text-shadow: 0 0 12px rgba(157,107,255,0.8); }
  .head .sub { color: var(--lk-dim); font-size: 12px; }
  .head .refresh { margin-left: auto; cursor: pointer; color: var(--lk-dim); border: 1px solid var(--lk-line); background: var(--lk-bg2); border-radius: 6px; padding: 4px 12px; font-size: 12px; }
  .tabs { display: flex; gap: 6px; padding: 10px 0; flex-wrap: wrap; }
  .tabs button { background: linear-gradient(180deg, var(--lk-bg2), #1a0e36); color: var(--lk-dim); border: 1px solid var(--lk-line); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; position: relative; }
  .tabs button.active { background: linear-gradient(135deg, #7c3aed, #a855f7, #d66bff); color: #fff; border-color: #b57bff; font-weight: 600; box-shadow: 0 0 14px rgba(168,85,247,0.55); }
  .tabs button.active::after { content: '✦'; position: absolute; top: -4px; right: -2px; font-size: 9px; color: #ffd8ff; }
  .card { background: linear-gradient(160deg, #2a1750, #1f0f3d 60%, #180b2e); border: 1px solid rgba(122,74,200,0.4); border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; box-shadow: 0 0 18px rgba(157,107,255,0.12), 0 4px 20px rgba(0,0,0,0.4); position: relative; }
  .card::before { content: '✦'; position: absolute; top: 8px; right: 14px; color: rgba(216,168,255,0.35); font-size: 12px; }
  .card h3 { font-size: 13px; color: #b78bff; letter-spacing: 0.1em; margin-bottom: 9px; text-shadow: 0 0 8px rgba(157,107,255,0.5); }
  .card h3::before { content: '✧ '; color: rgba(216,168,255,0.6); }
  .empty { color: var(--lk-dim); font-size: 12px; padding: 8px 0; text-align: center; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .kv .k { color: #a88cd6; white-space: nowrap; }
  .kv .v { color: var(--lk-text); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: rgba(122,74,200,0.18); border: 1px solid rgba(157,107,255,0.35); border-radius: 10px; padding: 1px 9px; font-size: 12px; color: #cbb0ff; }
  .track { margin: 8px 0; }
  .track .row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .track .lbl { width: 66px; font-size: 13px; color: var(--lk-dim); flex-shrink: 0; }
  .track .val { width: 46px; font-size: 12px; text-align: right; color: var(--lk-text); flex-shrink: 0; }
  .bar { flex: 1; height: 10px; background: #120a24; border-radius: 6px; overflow: hidden; border: 1px solid rgba(157,107,255,0.3); }
  .bar i { display: block; height: 100%; border-radius: 5px; transition: width 0.5s; box-shadow: 0 0 8px currentColor; }
  .subtrack { margin-left: 74px; font-size: 12px; color: var(--lk-dim); }
  .attr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .attr { background: linear-gradient(160deg, #1e1140, #170b2e); border: 1px solid rgba(157,107,255,0.3); border-radius: 8px; padding: 7px 9px; }
  .attr .nm { font-size: 12px; color: var(--lk-dim); }
  .attr .sc { font-size: 16px; font-weight: 700; color: #e8d0ff; }
  .attr .mod { font-size: 11px; color: var(--lk-gold); margin-left: 4px; }
  .node { border: 1px solid rgba(157,107,255,0.35); border-radius: 8px; padding: 7px 10px; margin: 6px 0; background: linear-gradient(160deg, #271550, #1c0f38); box-shadow: 0 0 10px rgba(157,107,255,0.1); }
  .node .h { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .node .h b { color: #e8d0ff; font-size: 13px; }
  .node .h .t { color: var(--lk-dim); font-size: 12px; }
  .node .badge { font-size: 11px; padding: 0 7px; border-radius: 8px; background: linear-gradient(135deg,#7c3aed,#d66bff); color: #fff; }
  .node .ev { font-size: 12px; color: var(--lk-dim); margin-top: 3px; }
  .node .ev::before { content: '✦ '; color: rgba(216,168,255,0.5); }
  .rel { display: flex; gap: 10px; align-items: flex-start; }
  .rel .nm { font-size: 14px; font-weight: 600; color: #e8d0ff; }
  .rel .meta { font-size: 12px; color: var(--lk-dim); margin-top: 1px; }
  .rel .fav { font-size: 12px; color: var(--lk-gold); margin-left: auto; white-space: nowrap; }
  .rel .heart { font-size: 12px; color: var(--lk-bad); margin-top: 1px; }
  .news-cat { margin-bottom: 8px; }
  .news-cat .cat { font-size: 12px; color: #b78bff; margin-bottom: 3px; }
  .news-cat .line { font-size: 12px; color: var(--lk-dim); line-height: 1.7; margin-bottom: 4px; }
  .stat-line { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat-pill { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: rgba(122,74,200,0.16); border: 1px solid rgba(157,107,255,0.3); color: var(--lk-dim); }
  .stat-pill b { color: var(--lk-text); font-weight: 500; }
  .stat-pill.hot b { color: var(--lk-bad); }
  .intel-item { border-bottom: 1px dashed rgba(157,107,255,0.25); padding: 5px 0; font-size: 12px; color: var(--lk-dim); line-height: 1.6; }
  .intel-item b { color: #cbb0ff; }
  .hidden { display: none !important; }
</style>

<div class="starfield" aria-hidden="true"></div>
<div class="starfield-twi" aria-hidden="true"></div>
<div id="app">
  <div class="head">
    <h1>✧ 临空市 · 守护者档案 ✧</h1>
    <span class="sub">人类与魔族战争前线 · 堕落追踪</span>
    <button class="refresh" onclick="refresh()">↻ 刷新</button>
  </div>

  <nav class="tabs">
    <button data-panel="profile" onclick="setTab('profile')">主角</button>
    <button data-panel="corruption" onclick="setTab('corruption')">堕落档案</button>
    <button data-panel="relations" onclick="setTab('relations')">关系</button>
    <button data-panel="quests" onclick="setTab('quests')">任务</button>
    <button data-panel="intel" onclick="setTab('intel')">情报</button>
    <button data-panel="news" onclick="setTab('news')">新闻</button>
  </nav>

  <!-- 主角 -->
  <div class="panel" data-panel="profile">
    <div class="card"><h3>身份档案</h3><div class="kv" id="pf-identity"></div><div class="chips" id="pf-skills" style="margin-top:8px"></div></div>
    <div class="card"><h3>六维属性（DND）</h3><div class="attr-grid" id="pf-attrs"></div></div>
    <div class="card"><h3>状态</h3><div class="stat-line" id="pf-status"></div><div class="chips" id="pf-abnormal" style="margin-top:7px"></div></div>
    <div class="card"><h3>魔力</h3><div class="kv" id="pf-magic"></div><div class="track" id="pf-magicbar"></div></div>
    <div class="card"><h3>改造</h3><div class="track" id="pf-mods"></div><div class="chips" id="pf-modlist" style="margin-top:7px"></div></div>
    <div class="card"><h3>持有物</h3><div class="chips" id="pf-items"></div></div>
  </div>

  <!-- 堕落档案 -->
  <div class="panel hidden" data-panel="corruption">
    <div class="card"><h3>三轨堕落</h3><div id="cor-tracks"></div></div>
    <div class="card"><h3>魔力转化</h3><div class="kv" id="cor-magic"></div></div>
    <div class="card"><h3>魔化表现</h3><div id="cor-mahua"></div></div>
    <div class="card"><h3>当前认知</h3><div id="cor-cognition"></div></div>
    <div class="card" id="cor-nodes-mahua"><h3>魔化 · 节点</h3><div class="nodes"></div></div>
    <div class="card" id="cor-nodes-eduo"><h3>恶堕 · 节点</h3><div class="nodes"></div></div>
    <div class="card" id="cor-nodes-yinhua"><h3>淫化 · 节点</h3><div class="nodes"></div></div>
    <div class="card"><h3>欲望 xp</h3><div id="cor-xp"></div></div>
    <div class="card"><h3>淫纹印记 / 特殊项目</h3><div id="cor-marks"></div></div>
  </div>

  <!-- 关系 -->
  <div class="panel hidden" data-panel="relations">
    <div id="rel-list"></div>
  </div>

  <!-- 任务 -->
  <div class="panel hidden" data-panel="quests">
    <div id="q-list"></div>
  </div>

  <!-- 情报 -->
  <div class="panel hidden" data-panel="intel">
    <div class="card"><div id="intel-list"></div></div>
  </div>

  <!-- 新闻 -->
  <div class="panel hidden" data-panel="news">
    <div id="news-list"></div>
  </div>
</div>

<script>
  /* ══════════ 数据 ══════════ */
  var ATTRS = ['力量', '敏捷', '体质', '智力', '感知', '魅力'];
  var TRACKS = [
    { key: '魔化度', name: '魔化', desc: '身体非人化 · 由淫魔力污染驱动' },
    { key: '恶堕度', name: '恶堕', desc: '心灵腐化 · 接受背叛与魔族思想' },
    { key: '淫化度', name: '淫化', desc: '欲望沉沦 · 接受性欲与魔素快感' }
  ];
  var tab = 'profile';
  var stat = {};

  function $ (id) { return document.getElementById(id); }
  function esc (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function num (v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function modStr (v) { var m = Math.floor((num(v) - 10) / 2); return m >= 0 ? '+' + m : '' + m; }
  function barColor (v) { v = num(v); if (v <= 25) return '#4fd68a'; if (v <= 60) return '#e8b04a'; if (v <= 90) return '#e0707a'; return '#c04860'; }
  function eroColor (v) { v = num(v); if (v <= 30) return '#7bd0a0'; if (v <= 60) return '#9d6bff'; if (v <= 80) return '#e0707a'; return '#c04860'; }
  function pct (v) { v = num(v); return Math.max(0, Math.min(100, v)) + '%'; }
  function favColor (v) { v = num(v); if (v < 0) return '#e0707a'; if (v >= 60) return '#e8c87a'; return '#7bd0a0'; }
  function convColor (v) { return (!v || v === '无') ? '#a88cd6' : '#e0707a'; }
  function fmtList (v) { return Array.isArray(v) ? v.join('、') : (v || '—'); }

  /* ══════════ 渲染 ══════════ */
  function setTab (t) {
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-panel') === t); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('hidden', p.getAttribute('data-panel') !== t); });
    render();
  }

  function render () {
    if (tab === 'profile') renderProfile();
    else if (tab === 'corruption') renderCorruption();
    else if (tab === 'relations') renderRelations();
    else if (tab === 'quests') renderQuests();
    else if (tab === 'intel') renderIntel();
    else if (tab === 'news') renderNews();
  }

  function p () { return stat.主角 || {}; }
  function arch () { return p().堕落档案 || {}; }

  function renderProfile () {
    var pj = p();
    var skills = (pj.熟练项 || []);
    var idHtml =
      '<span class="k">姓名</span><span class="v"><b>' + esc(pj.姓名 || '未设定') + '</b>' + (pj.昵称 ? '（' + esc(pj.昵称) + '）' : '') + '</span>' +
      '<span class="k">年龄 / 性别</span><span class="v">' + esc(pj.年龄 || '?') + ' · ' + esc(pj.性别 || '女性') + '</span>' +
      '<span class="k">种族</span><span class="v">' + esc(pj.种族 || '人类') + '</span>' +
      '<span class="k">所属组织</span><span class="v">' + esc(pj.所属组织 || '无') + '</span>' +
      '<span class="k">身份 / 职位</span><span class="v">' + esc(fmtList(pj.身份)) + '（' + esc(pj.职位 || '见习') + '）</span>' +
      '<span class="k">资金</span><span class="v">' + esc(pj.资金 || '普通') + '</span>';
    $('pf-identity').innerHTML = idHtml;
    $('pf-skills').innerHTML = skills.length ? skills.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join('') : '';

    var attrs = (pj.属性 || {});
    $('pf-attrs').innerHTML = ATTRS.map(function (a) {
      return '<div class="attr"><div class="nm">' + a + '</div><div><span class="sc">' + num(attrs[a] || 8) + '</span><span class="mod">mod ' + modStr(attrs[a] || 8) + '</span></div></div>';
    }).join('');

    var st = pj.状态 || {};
    var hotLust = ['发情', '失神'].indexOf(st.发情) >= 0;
    var hotWound = ['重伤', '濒危'].indexOf(st.伤痛) >= 0;
    $('pf-status').innerHTML =
      '<span class="stat-pill">体力 <b>' + esc(st.体力 || '充沛') + '</b></span>' +
      '<span class="stat-pill">魔力 <b>' + esc(st.魔力 || '充盈') + '</b></span>' +
      '<span class="stat-pill">清醒 <b>' + esc(st.清醒 || '清醒') + '</b></span>' +
      '<span class="stat-pill' + (hotLust ? ' hot' : '') + '">发情 <b>' + esc(st.发情 || '冷静') + '</b></span>' +
      '<span class="stat-pill' + (hotWound ? ' hot' : '') + '">伤痛 <b>' + esc(st.伤痛 || '无') + '</b></span>';
    var ab = st.异常 || {};
    $('pf-abnormal').innerHTML = Object.keys(ab).length
      ? Object.keys(ab).map(function (k) { return '<span class="chip">' + esc(k) + '：' + esc((ab[k] || {}).效果) + ' <em style="opacity:.6">（' + esc((ab[k] || {}).剩余) + '）</em></span>'; }).join('')
      : '';

    var mg = pj.魔力 || {};
    $('pf-magic').innerHTML =
      '<span class="k">类型</span><span class="v">' + esc(mg.类型 || '无') + '</span>' +
      '<span class="k">转化</span><span class="v"><b style="color:' + convColor(mg.转化) + '">' + esc(mg.转化 || '无') + '</b></span>';
    $('pf-magicbar').innerHTML = '<div class="row"><span class="lbl">觉醒度</span><div class="bar"><i style="width:' + pct(mg.觉醒度) + ';background:' + barColor(mg.觉醒度) + '"></i></div><span class="val">' + num(mg.觉醒度) + '</span></div>';

    var mods = pj.改造 || {};
    $('pf-mods').innerHTML = '<div class="row"><span class="lbl">改造度</span><div class="bar"><i style="width:' + pct(mods.程度) + ';background:' + barColor(mods.程度) + '"></i></div><span class="val">' + num(mods.程度) + '</span></div>';
    var modList = mods.列表 || {};
    $('pf-modlist').innerHTML = Object.keys(modList).length
      ? Object.keys(modList).map(function (k) { return '<span class="chip">' + esc(k) + '：' + esc((modList[k] || {}).类型) + ' <em style="opacity:.6">（' + esc((modList[k] || {}).位置) + '）</em></span>'; }).join('')
      : '';

    var items = pj.持有物 || {};
    $('pf-items').innerHTML = Object.keys(items).length
      ? Object.keys(items).map(function (k) { return '<span class="chip">' + esc(k) + ' ×' + (num(items[k].数量) || 1) + '</span>'; }).join('')
      : '<div class="empty">暂无持有物</div>';
  }

  function barTrack (lbl, val, max, colorFn, desc) {
    return '<div class="track"><div class="row"><span class="lbl">' + lbl + '</span><div class="bar"><i style="width:' + pct(val) + ';background:' + colorFn(val) + '"></i></div><span class="val">' + num(val) + '/' + max + '</span></div>' + (desc ? '<div class="subtrack">' + desc + '</div>' : '') + '</div>';
  }
  function nodeCards (nodes) {
    if (!nodes) return '<div class="empty">尚未激活任何节点</div>';
    var keys = Object.keys(nodes).filter(function (k) { return nodes[k] && nodes[k].是否激活 === true; });
    if (!keys.length) return '<div class="empty">尚未激活任何节点</div>';
    return keys.map(function (k) {
      var nd = nodes[k];
      return '<div class="node"><div class="h"><b>✦ ' + esc(nd.名称 || k) + '</b><span class="t">阈值 ' + num(nd.阈值) + '</span><span class="badge">已激活</span></div>' +
        (nd.节点事件 ? '<div class="ev">事件：' + esc(nd.节点事件) + '</div>' : '') +
        (nd.心态变化 ? '<div class="ev">心态：' + esc(nd.心态变化) + '</div>' : '') + '</div>';
    }).join('');
  }
  function renderCorruption () {
    var a = arch();
    $('cor-tracks').innerHTML =
      TRACKS.map(function (t) { return barTrack(t.name, a[t.key], 100, barColor, t.desc); }).join('') +
      barTrack('魔性侵蚀', p().魔性侵蚀, 100, eroColor, '淫魔力污染——三轨的共同燃料');
    var mg = p().魔力 || {};
    $('cor-magic').innerHTML =
      '<span class="k">当前转化</span><span class="v"><b style="color:' + convColor(mg.转化) + '">' + esc(mg.转化 || '无') + '</b></span>' +
      '<span class="k">说明</span><span class="v" style="font-size:12px;color:#a88cd6">圣光→圣邪光 / 灵气→堕灵气 / 魔导→淫魔导（恶堕/淫化≥40 自动触发）</span>';
    $('cor-mahua').innerHTML = a.魔化表现 ? '<div style="font-size:13px;line-height:1.7">' + esc(a.魔化表现) + '</div>' : '<div class="empty">身体尚未出现非人特征</div>';
    $('cor-cognition').innerHTML = a.当前认知 ? '<pre style="font-size:12px;color:#a88cd6;white-space:pre-wrap;line-height:1.7;font-family:inherit">' + esc(a.当前认知) + '</pre>' : '<div class="empty">尚未记录心态认知</div>';
    $('cor-nodes-mahua').querySelector('.nodes').innerHTML = nodeCards(a.魔化节点);
    $('cor-nodes-eduo').querySelector('.nodes').innerHTML = nodeCards(a.恶堕节点);
    $('cor-nodes-yinhua').querySelector('.nodes').innerHTML = nodeCards(a.淫化节点);
    var xp = a.欲望xp || {};
    $('cor-xp').innerHTML = Object.keys(xp).length
      ? Object.keys(xp).map(function (k) { var x = xp[k]; return '<div class="node"><div class="h"><b>' + esc(x.名字 || k) + '</b><span class="t">开发程度：' + esc(x.开发程度 || '未开发') + '</span></div>' + (x.描述 ? '<div class="ev">' + esc(x.描述) + '</div>' : '') + '</div>'; }).join('')
      : '<div class="empty">尚未开发性癖</div>';
    var merged = {};
    var mk = a.淫纹印记 || {}; Object.keys(mk).forEach(function (k) { merged[k] = mk[k]; });
    var sp = a.特殊项目 || {}; Object.keys(sp).forEach(function (k) { merged[k] = sp[k]; });
    $('cor-marks').innerHTML = Object.keys(merged).length
      ? Object.keys(merged).map(function (k) { var m = merged[k]; return '<div class="node"><div class="h"><b>' + esc(m.名字 || k) + '</b><span class="t">' + esc(m.类型) + '</span><span class="t">' + esc(m.状态) + '</span></div>' + (m.描述 ? '<div class="ev">' + esc(m.描述) + '</div>' : '') + '</div>'; }).join('')
      : '<div class="empty">尚无印记或特殊项目</div>';
  }

  function renderRelations () {
    var rel = stat.关系列表 || {};
    var keys = Object.keys(rel);
    if (!keys.length) { $('rel-list').innerHTML = '<div class="card"><div class="empty">暂无关系角色</div></div>'; return; }
    $('rel-list').innerHTML = keys.map(function (name) {
      var r = rel[name] || {};
      var tracks = TRACKS.map(function (t) {
        return '<div class="row" style="width:calc(100% - 50px);margin-left:50px"><span class="lbl" style="width:44px">' + t.name.slice(0, 2) + '</span><div class="bar"><i style="width:' + pct(r[t.key]) + ';background:' + barColor(r[t.key]) + '"></i></div><span class="val">' + num(r[t.key]) + '</span></div>';
      }).join('');
      return '<div class="card"><div class="rel"><div><div class="nm">✦ ' + esc(r.姓名 || name) + '</div>' +
        '<div class="meta">' + esc(r.种族 || '?') + ' · ' + esc(r.所属组织 || '无') + ' · ' + esc(fmtList(r.身份)) + '</div>' +
        (r.性格 ? '<div class="meta">' + esc(r.性格) + '</div>' : '') + '</div>' +
        '<div class="fav"><div>好感度 <b style="color:' + favColor(r.好感度) + '">' + num(r.好感度) + '</b></div>' +
        (r.关系标签 && r.关系标签.length ? '<div class="heart">' + esc(r.关系标签.join('、')) + '</div>' : '') + '</div></div>' +
        '<div class="track" style="margin-top:7px">' + tracks + '</div>' +
        (r.当前认知 ? '<div class="subtrack" style="font-size:12px;color:#a88cd6">' + esc(r.当前认知) + '</div>' : '') + '</div>';
    }).join('');
  }

  function renderQuests () {
    var qs = stat.任务列表 || {};
    var keys = Object.keys(qs);
    if (!keys.length) { $('q-list').innerHTML = '<div class="card"><div class="empty">暂无任务</div></div>'; return; }
    $('q-list').innerHTML = keys.map(function (name) {
      var q = qs[name] || {};
      return '<div class="card"><div class="kv">' +
        '<span class="k">任务</span><span class="v"><b>' + esc(name) + '</b> <span class="chip" style="margin-left:6px">' + esc(q.关注度 || '中') + '</span></span>' +
        '<span class="k">状态</span><span class="v">' + esc(q.状态 || '进行中') + '</span>' +
        '<span class="k">进展</span><span class="v">' + esc(q.进展 || '—') + '</span>' +
        '<span class="k">详情</span><span class="v">' + esc(q.详情 || '—') + '</span>' +
        '<span class="k">奖励</span><span class="v">' + esc(q.奖励 || '—') + '</span></div></div>';
    }).join('');
  }

  function renderIntel () {
    var info = stat.信息 || {};
    var keys = Object.keys(info);
    if (!keys.length) { $('intel-list').innerHTML = '<div class="empty">暂无情报</div>'; return; }
    $('intel-list').innerHTML = keys.map(function (name) {
      var inf = info[name];
      var body = typeof inf === 'string' ? '：' + esc(inf) : (inf && inf.内容 ? '：' + esc(inf.内容) + (inf.来源 ? ' <em style="opacity:.7">（来源：' + esc(inf.来源) + '）</em>' : '') : '');
      return '<div class="intel-item"><b>✦ ' + esc(name) + '</b>' + body + '</div>';
    }).join('');
  }

  function renderNews () {
    var news = stat.新闻 || {};
    var cats = Object.keys(news);
    if (!cats.length) { $('news-list').innerHTML = '<div class="card"><div class="empty">暂无新闻</div></div>'; return; }
    $('news-list').innerHTML = cats.map(function (catName) {
      var cat = news[catName] || {};
      var inner = Object.keys(cat).map(function (k) {
        return '<div class="news-cat"><div class="cat">✧ ' + esc(k) + '</div><div class="line">' + esc(cat[k] || '—') + '</div></div>';
      }).join('');
      return '<div class="card"><h3>' + esc(catName) + '</h3>' + inner + '</div>';
    }).join('');
  }

  /* ══════════ 数据读取 ══════════ */
  function refresh () {
    try {
      var v = getVariables({ type: 'message', message_id: getCurrentMessageId() });
      stat = (v && v.stat_data) || {};
    } catch (e) { console.error('[临空市状态] 读取失败', e); stat = {}; }
    render();
  }

  /* ══════════ 初始化 ══════════ */
  function init () {
    setTab('profile');
    refresh();
    if (typeof waitGlobalInitialized === 'function' && typeof eventOn === 'function') {
      try {
        eventOn(tavern_events.GENERATION_AFTER_COMMANDS, refresh);
        eventOn(tavern_events.MESSAGE_SENT, refresh);
      } catch (e) {}
    }
    setInterval(refresh, 15000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
