<!-- 悦悦 · 状态面板（纯原生 JS 自包含版，零 CDN） -->
<style>
  :root {
    --yy-bg: #10131a; --yy-bg2: #171b26; --yy-card: #1d2230; --yy-line: #2c3444;
    --yy-text: #eef1f6; --yy-dim: #9aa5b8; --yy-accent: #ff6b9d; --yy-accent2: #ff9ec4;
    --yy-gold: #ffd97a; --yy-green: #6bffb0; --yy-red: #ff7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--yy-bg); font-family: "Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif; color: var(--yy-text); font-size: 14px; min-height: 100%; position: relative; overflow-x: hidden; }
  #app { max-width: 900px; margin: 0 auto; padding: 14px 16px 60px; position: relative; z-index: 1; min-height: 100vh; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 10px;
    border: 1px solid rgba(255,107,157,0.4); border-radius: 14px;
    background: linear-gradient(135deg, rgba(255,107,157,0.16), rgba(255,158,196,0.06), rgba(23,27,38,0.7));
    box-shadow: 0 0 24px rgba(255,107,157,0.18); }
  .head h1 { font-size: 19px; color: var(--yy-accent2); letter-spacing: 0.1em; flex: 1; }
  .head .ts { font-size: 11px; color: var(--yy-dim); }
  .tabs { display: flex; gap: 6px; padding: 8px 0; flex-wrap: wrap; }
  .tabs button { background: var(--yy-bg2); color: var(--yy-dim); border: 1px solid var(--yy-line); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: linear-gradient(135deg, #ff6b9d, #ff9ec4); color: #1a0d14; font-weight: 700; border-color: transparent; }
  .card { background: linear-gradient(160deg, #202637, #1a1f2c 60%, #161a26); border: 1px solid rgba(90,110,150,0.35); border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; }
  .card h3 { font-size: 13px; color: var(--yy-accent2); margin-bottom: 10px; }
  .card h3::before { content: '♡ '; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
  .kv .k { color: var(--yy-dim); }
  .kv .v { color: var(--yy-text); }
  .bar { height: 6px; border-radius: 3px; background: rgba(90,110,150,0.3); margin: 4px 0 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ff6b9d, #ffd97a); }
  .chip { display: inline-block; background: rgba(255,107,157,0.12); border: 1px solid rgba(255,107,157,0.35); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--yy-accent2); margin: 2px 3px 2px 0; }
  .chip.gold { border-color: var(--yy-gold); color: var(--yy-gold); background: rgba(255,217,122,0.1); }
  .empty { color: var(--yy-dim); font-size: 13px; text-align: center; padding: 20px 0; }
  .rel-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .rel-head .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background: linear-gradient(135deg, #ff6b9d, #b06bff); flex-shrink: 0; }
  .rel-head .nm { font-size: 15px; font-weight: 700; }
  .rel-head .tag { font-size: 12px; color: var(--yy-accent2); }
  .rel-head .aff { font-size: 12px; color: var(--yy-gold); margin-left: auto; }
  .detail { margin-top: 10px; border-top: 1px dashed rgba(90,110,150,0.4); padding-top: 10px; }
  .acc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .acc-row .nm { width: 72px; color: var(--yy-dim); flex-shrink: 0; }
  .acc-row .bar { flex: 1; }
  .acc-row .val { width: 30px; text-align: right; color: var(--yy-accent2); }
  .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .toggle { width: 46px; height: 24px; border-radius: 12px; background: rgba(90,110,150,0.4); position: relative; cursor: pointer; transition: all 0.2s; }
  .toggle.on { background: linear-gradient(90deg, #ff6b9d, #ffd97a); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: all 0.2s; }
  .toggle.on::after { left: 24px; }
  .hidden { display: none !important; }
</style>
<body>
<div id="app">
  <div class="head">
    <h1>♡ 悦悦 · 状态</h1>
    <span class="ts" id="head-ts"></span>
    <button class="mini-refresh" onclick="refresh()" style="background:none;border:1px solid var(--yy-line);color:var(--yy-dim);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px">⟳</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panel-profile" class="tab-panel"></div>
  <div id="panel-relations" class="tab-panel hidden"></div>
  <div id="panel-yue" class="tab-panel hidden"></div>
  <div id="panel-accept" class="tab-panel hidden"></div>
  <div id="panel-dlc" class="tab-panel hidden"></div>
</div>

<script>
(function () {
  'use strict';
  var stat = {};
  var cur = 'profile';

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function num(v, d) { var n = Number(v); return isNaN(n) ? d : n; }
  function pct(v) { return Math.max(0, Math.min(100, num(v, 0))); }

  var TABS = [
    ['profile', '主角'], ['relations', '关系'], ['yue', '悦悦'], ['accept', '接受程度'], ['dlc', 'DLC']
  ];

  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="' + (t[0] === cur ? 'active' : '') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('');
  }
  window.setTab = function (t) {
    cur = t;
    TABS.forEach(function (x) { $('panel-' + x[0]).classList.toggle('hidden', x[0] !== t); });
    renderTabs();
  };

  /* ── 主角 ── */
  function renderProfile() {
    var p = stat.主角 || {};
    var yue = p.悦悦 || {};
    var rows = [
      ['姓名', p.姓名 || '—'], ['昵称', p.昵称 || '—'],
      ['年龄/性别', (p.年龄 != null ? p.年龄 : '—') + ' / ' + (p.性别 || '—')],
      ['职业', p.职业 || '—'], ['居住', p.居住地 || '—'],
      ['经验', p.经验 || '—'],
      ['外貌', p.外貌 || '—'], ['性格', p.性格 || '—'],
      ['状态', [p.状态 && p.状态.体力, p.状态 && p.状态.清醒, p.状态 && p.状态.发情].filter(Boolean).join(' / ') || '—']
    ];
    $('panel-profile').innerHTML =
      '<div class="card"><h3>主角档案</h3><div class="kv">' + rows.map(function (r) {
        return '<div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(r[1]) + '</div>';
      }).join('') + '</div></div>' +
      '<div class="card"><h3>悦悦账号</h3><div class="kv">' +
        '<div class="k">账号</div><div class="v">' + esc(yue.账号 || '—') + '</div>' +
        '<div class="k">匹配状态</div><div class="v">' + esc(yue.匹配状态 || '—') + '</div>' +
        '<div class="k">行为分</div><div class="v">' + num(yue.行为分, 80) + ' / 100</div>' +
        '<div class="k">约过人数</div><div class="v">' + num(yue.约过人数, 0) + '</div>' +
      '</div></div>';
  }

  /* ── 关系 ── */
  function renderRelations() {
    var rel = stat.关系列表 || {};
    var keys = Object.keys(rel);
    if (!keys.length) { $('panel-relations').innerHTML = '<div class="card"><div class="empty">暂无关系对象。通过悦悦匹配或现实认识建立关系。</div></div>'; return; }
    var html = keys.map(function (name) {
      var r = rel[name] || {};
      var aff = num(r.好感度, 0);
      var affLabel = aff >= 96 ? '沉沦' : aff >= 81 ? '依赖' : aff >= 51 ? '情人' : aff >= 21 ? '暧昧' : aff >= 0 ? '网友' : '反感';
      var acc = r.接受程度 || {};
      var plays = Array.isArray(r.特殊玩法) ? r.特殊玩法 : [];
      return '<div class="card">' +
        '<div class="rel-head" onclick="toggleDetail(\'' + esc(name) + '\')">' +
          '<div class="avatar">♡</div>' +
          '<div><div class="nm">' + esc(r.姓名 || name) + '</div><div class="tag">' + esc(r.职业 || '') + ' · ' + esc(r.关系标签 || '网友') + '</div></div>' +
          '<div class="aff">' + aff + ' · ' + affLabel + '</div>' +
        '</div>' +
        '<div class="bar"><i style="width:' + pct((aff + 100) / 2) + '%"></i></div>' +
        '<div class="detail hidden" id="detail-' + esc(name) + '">' +
          '<div class="kv">' +
            '<div class="k">外貌</div><div class="v">' + esc(r.外貌 || '—') + '</div>' +
            '<div class="k">性格</div><div class="v">' + esc(r.性格 || '—') + '</div>' +
            '<div class="k">心里话</div><div class="v">' + esc(r.心里话 || '—') + '</div>' +
            '<div class="k">关系动态</div><div class="v">' + esc(r.关系动态 || '—') + '</div>' +
          '</div>' +
          '<div style="margin-top:8px">' + (plays.length ? plays.map(function (p) { return '<span class="chip gold">' + esc(p) + '</span>'; }).join('') : '<span class="chip">暂无特殊玩法</span>') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    $('panel-relations').innerHTML = html;
  }
  window.toggleDetail = function (name) {
    var el = $('detail-' + name);
    if (el) el.classList.toggle('hidden');
  };

  /* ── 悦悦 ── */
  function renderYue() {
    var news = stat.新闻 || {};
    var yueNews = news.悦悦圈内 || {};
    var yue = (stat.主角 && stat.主角.悦悦) || {};
    var html = '<div class="card"><h3>匹配状态</h3><div class="kv">' +
      '<div class="k">账号</div><div class="v">' + esc(yue.账号 || '—') + '</div>' +
      '<div class="k">匹配状态</div><div class="v">' + esc(yue.匹配状态 || '—') + '</div>' +
      '<div class="k">行为分</div><div class="v">' + num(yue.行为分, 80) + ' / 100</div>' +
      '<div class="k">约过人数</div><div class="v">' + num(yue.约过人数, 0) + '</div>' +
    '</div></div>';
    html += '<div class="card"><h3>悦悦圈内</h3>';
    var keys = Object.keys(yueNews);
    if (!keys.length) html += '<div class="empty">暂无圈内消息</div>';
    else html += '<div class="kv">' + keys.map(function (k) {
      return '<div class="k">' + esc(k) + '</div><div class="v">' + esc(yueNews[k] || '—') + '</div>';
    }).join('') + '</div>';
    html += '</div>';
    var daily = news.都市日报 || {};
    html += '<div class="card"><h3>都市日报</h3><div class="kv">' +
      Object.keys(daily).map(function (k) { return '<div class="k">' + esc(k) + '</div><div class="v">' + esc(daily[k] || '—') + '</div>'; }).join('') +
    '</div></div>';
    $('panel-yue').innerHTML = html;
  }

  /* ── 接受程度 ── */
  function renderAccept() {
    var rel = stat.关系列表 || {};
    var keys = Object.keys(rel);
    if (!keys.length) { $('panel-accept').innerHTML = '<div class="card"><div class="empty">暂无关系对象。</div></div>'; return; }
    var ACC = ['被辱骂', '掌掴', '束缚', '露出', '羞耻play', '命令服从'];
    var html = keys.map(function (name) {
      var r = rel[name] || {};
      var acc = r.接受程度 || {};
      var aff = num(r.好感度, 0);
      // 好感度系数（与<接受程度系统>一致）
      var coef = aff <= 20 ? 0.5 : aff <= 50 ? 0.8 : aff <= 80 ? 1.0 : aff <= 95 ? 1.2 : 1.3;
      var rows = ACC.map(function (a) {
        var base = num(acc[a], 0);
        var eff = Math.round(base * coef);
        return '<div class="acc-row"><span class="nm">' + a + '</span>' +
          '<div class="bar"><i style="width:' + pct(eff) + '%"></i></div>' +
          '<span class="val">' + eff + '</span></div>';
      }).join('');
      return '<div class="card"><h3>' + esc(r.姓名 || name) + '（好感度' + aff + '，系数×' + coef + '）</h3>' + rows +
        '<div class="hint" style="color:var(--yy-dim);font-size:11px;margin-top:6px">实际接受值 = 基础值 × 好感度系数。数值越高越能接受对应玩法。</div></div>';
    }).join('');
    $('panel-accept').innerHTML = html;
  }

  /* ── DLC ── */
  function renderDlc() {
    var w = stat.世界 || {};
    var d1 = w.悦悦DLC_少子化对策 === true;
    var d2 = w.悦悦DLC_都市夜行 === true;
    $('panel-dlc').innerHTML =
      '<div class="card"><h3>DLC 开关</h3>' +
        '<p class="hint" style="margin-bottom:10px">开关写入 stat_data（世界.悦悦DLC_*）。<b>注意</b>：还需在 SillyTavern 世界书中手动启用对应条目（0_DLC条目/），条目内的 {{setvar}} 才会注入变量。</p>' +
        '<div class="toggle-row"><span style="flex:1">少子化对策（政府背景·无套/生育玩法）</span><div class="toggle' + (d1 ? ' on' : '') + '" onclick="toggleDlc(\'少子化对策\')"></div></div>' +
        '<div class="toggle-row"><span style="flex:1">都市夜行（深夜场景/夜间玩法）</span><div class="toggle' + (d2 ? ' on' : '') + '" onclick="toggleDlc(\'都市夜行\')"></div></div>' +
      '</div>' +
      '<div class="card"><h3>当前状态</h3><div class="kv">' +
        '<div class="k">少子化对策</div><div class="v">' + (d1 ? '✅ 已启用' : '未启用') + '</div>' +
        '<div class="k">都市夜行</div><div class="v">' + (d2 ? '✅ 已启用' : '未启用') + '</div>' +
      '</div></div>';
  }
  window.toggleDlc = async function (name) {
    var key = '悦悦DLC_' + name;
    var w = stat.世界 = stat.世界 || {};
    w[key] = w[key] !== true;
    try {
      if (typeof waitGlobalInitialized === 'function') await waitGlobalInitialized('Mvu');
      if (window.Mvu) {
        var data = Mvu.getMvuData({ type: 'message', message_id: getCurrentMessageId() });
        if (!data) data = { stat_data: {} };
        if (!data.stat_data) data.stat_data = {};
        data.stat_data['世界'] = stat.世界;
        await Mvu.replaceMvuData(data, { type: 'message', message_id: getCurrentMessageId() });
      }
      try { if (w[key] === true && typeof setvar === 'function') setvar(key, '1'); else if (typeof setvar === 'function') setvar(key, ''); } catch (e) {}
    } catch (e) { console.error('DLC 开关写入失败', e); }
    renderDlc();
  };

  /* ── 数据读取 ── */
  window.refresh = function () {
    try {
      var v = getVariables({ type: 'message', message_id: getCurrentMessageId() });
      stat = (v && v.stat_data) || {};
    } catch (e) { console.error('[悦悦状态] 读取失败', e); stat = {}; }
    var w = stat.世界 || {};
    var ts = w.时间 ? w.时间 : '—';
    var wn = w.世界名 ? ' · ' + w.世界名 : '';
    $('head-ts').textContent = ts + wn;
    renderTabs();
    renderProfile();
    renderRelations();
    renderYue();
    renderAccept();
    renderDlc();
  };

  function init() {
    setTab('profile');
    refresh();
    if (typeof waitGlobalInitialized === 'function' && typeof eventOn === 'function') {
      try {
        eventOn(tavern_events.GENERATION_AFTER_COMMANDS, refresh);
        eventOn(tavern_events.MESSAGE_SENT, refresh);
      } catch (e) {}
    }
    setInterval(refresh, 15000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
