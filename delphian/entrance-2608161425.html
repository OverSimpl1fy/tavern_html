      "description": "白鸦港不问来历、只问银钱，而你是在这自由港下城区长大的帮会跑腿，替某个行会收账、传话、盯梢。你熟悉每一条暗巷、每一个只收白鸦银票的当铺，也清楚哪些恩怨能用钱了、哪些只能见血。这天，你被派去码头接一批「从魔界商路来的货」，交货的却是一个浑身魔气、眼神阴冷的魅魔。她没给你货，只给了你一句话：「告诉你们港督，有人要把裂隙里的东西，运进主世界。」",
      "requiredLocation": "弥黎安大陆-东-珍珠海岸(海峡口)-白鸦自由港"
    },
    {
      "name": "码头掮客",
      "description": "你是白鸦港码头区的掮客，替往来的商船找引航员、找仓库、找「不需要上账」的通道。这自由港是大陆情报与黑市的中心，你每天都能听到十几种语言、上百桩真假难辨的消息。可消息也是生意。近来，你从几路水手的醉话里拼出一个惊人的事实：连续七艘驶往珍珠海的船，都在同一片雾区失踪，而灯塔的瞭望记录，偏偏在那几个夜晚全数「缺页」。",
      "requiredLocation": "弥黎安大陆-东-珍珠海岸(海峡口)-白鸦自由港"
    }
  ],
  "血裔开局": [
    {
      "name": "血仆侍从",
      "description": "你是血月元老院某氏族的血仆，以凡人之躯侍奉一位血族贵族，替他打理白天无法现身时的一切事务。你知晓暗夜世界的规矩：血脉、誓约与秘密，比阳光下的律法更重。你为主人奔走于主世界的各大城市，处理见不得光的产业，也见过那些妄图刺探血族隐秘之人的下场。今夜，主人把你唤至身前，交给你一封信，命你在黎明前送抵白鸦港——收信人，是一位连你都不该知道其名的存在。",
      "requiredRace": "血族"
    },
    {
      "name": "初拥新贵",
      "description": "你刚刚接受初拥，成为十三氏族之下的新血，褪去了凡躯，也从此告别了白昼。血月大公治下的元老院规矩森严，血脉越纯、地位越高，而你这个「外来者」尚在暗夜世界的最底层，连饮血都要看长辈的脸色。你既贪婪又恐惧，既渴望融入又害怕被吞噬。初拥你的那位「恩主」对你异常上心，似乎别有所图——他今夜要带你去见一个人，一个据说是从魔界来的「老朋友」。",
      "requiredRace": "血族"
    }
  ],
  "银冠城开局": [
    {
      "name": "信使学徒",
      "description": "银冠城是大陆最高处的城市，也是最快信使网络的中心，而你是一名刚取得单飞资格的年轻信使。你背着信筒，掠过云层与山脊，替王公、商会与教会传递那些「必须在天黑前送到」的消息。天空也有它的规矩：信风、雷暴，还有盘踞云层的雷暴隼。这一天，你接下了一封加急的信件，封蜡上印着一枚你从未见过的黑色纹章。收件人那一栏，只写了三个字——「德尔菲安」。",
      "requiredLocation": "弥黎安大陆-中央-神庭山脉高空-银冠天空城"
    },
    {
      "name": "天文观测员",
      "description": "你在银冠城的天文台里，整夜守望着星辰与信风，为往来的飞驿预报航线。这份差事安静、清苦，却让你比大多数人更早看见天空的异变。近三个月来，你连续记录到同一片星区的光芒在缓慢偏移，仿佛有某种巨大的东西，正在神庭山脉上空的云层深处苏醒。你把观测记录上报给天翼议会，得到的回复却只有四个字：「删掉它们。」",
      "requiredLocation": "弥黎安大陆-中央-神庭山脉高空-银冠天空城"
    }
  ],
  "晨星学院开局": [
    {
      "name": "晨星学院学徒",
      "description": "你自幼便显露天资，被游学至此的晨星学院考官一眼相中，破例引上浮空城。星港的云海、晨晖台的大讲堂、万象市各族商贩的吆喝，都让你目不暇接。这座大陆最高学府不问出身、只问天赋，免学费、食宿全免，而你要做的只有一件事：在「曦光入学礼」的检测里，向院长联席会证明你的天资配得上这里。可就在入学礼前夜，你在炼星工坊外撞见一具坠落在浮岛边缘的翼民信使，他怀里死死攥着半页被撕去的星图。",
      "requiredLocation": "弥黎安大陆-中央-云海-晨星学院"
    }
  ],
  "魔界开局": [
    {
      "name": "魔界使节随从",
      "description": "你是魔界某位使节的随从，随使团穿过裂隙商路，来到主世界。魔界称此地为「蚀渊」，环境险恶、魔气蚀骨，却也盛产主世界梦寐以求的魔晶与暗钢。使团的公开使命是洽谈贸易，可你清楚，真正要办的事从不写在国书里。抵达白鸦自由港后，使节秘密会见了港督，而你在门外守候时，听见了从使节喉中逸出的、不属于他本音的一句低语：「痛苦女神的眼线，已经渗进来了。」",
      "requiredRace": "魅魔",
      "requiredLocation": "弥黎安大陆-东-珍珠海岸(海峡口)-白鸦自由港"
    },
    {
      "name": "裂隙走私者",
      "description": "你曾是龙魔麾下的佣兵，如今却做了穿梭于裂隙之间的走私者，把魔界的暗钢、魔血草与深渊宝石，偷运进主世界的黑市。你熟悉每一条小路与每一处裂隙，也清楚哪些守卫可以买通、哪些绝对不能招惹。这一趟，你押着一批「只问价、不问出处」的货，却在神庭山脉西麓裂隙附近撞上了一支主世界的巡逻队。为首的军官没有抓你，反而开价，要你带他去魔界见一个人。",
      "requiredRace": "龙魔",
      "requiredLocation": "弥黎安大陆-东-珍珠海岸(海峡口)-白鸦自由港"
    }
  ],
  "种族开局": [
    {
      "name": "哥布林求生",
      "description": "你是一只从河沼哥布林巢穴里逃出来的哥布林，瘦小、机灵，也被人轻贱。你的族人劫道、偷窃、苟活，从没被谁正眼看过，可你不甘心就这样烂在芦苇荡里。你偷来了一柄豁口的短刀，也偷学了几句通用语，跌跌撞撞地走向了有人烟的地方。这个世界对你的第一句话，往往是一声冷笑，或者一块飞来的石头。但你肚子里还揣着一件东西——一张画着「哥布林王冠」的破旧羊皮，据说能号令所有流散的哥布林部族。",
      "requiredRace": "哥布林"
    },
    {
      "name": "魔裔流亡",
      "description": "你是魔裔，生来便顶着双角与深色皮肤，血统里流着魔界的影子。主世界的人看你的目光，有恐惧、有怜悯，也有不加掩饰的厌恶。你在卡米利亚圣国被以「普世蒙恩」之名接纳，学会了用温顺与勤奋换取一席之地，可心里的刺从未拔除。近来，圣国边境兴起了一股「驱魔风潮」，扬言要清查所有魔裔。你在深夜收拾行囊，准备再度流亡时，一个从未见过的同族找到你，说他知道你「另一半血统」的来历。",
      "requiredRace": "魔裔"
    },
    {
      "name": "血族初拥",
      "description": "你曾是凡人，如今是血族。那一夜的初拥夺走了你的体温，也给了你永夜里的新生。你惧怕阳光，渴望鲜血，又拼命想守住最后一点人性。你不属于任何氏族，也没有「恩主」庇佑，是个游荡在暗夜里的野种。白天你躲在不见天日的地方，夜里才敢出来觅食。今晚，你在一条窄巷里猎食时，撞见了另一个血族——他穿着血月元老院的徽记，对你说：「终于找到你了，被选中的那个。」",
      "requiredRace": "血族"
    },
    {
      "name": "兽人部落",
      "description": "你是兽人，出生在北方苔原的部落，如今却成了无根的流寇。你的部族在帝国的清剿与霜狼的猎颅之间流散，活下来的要么归附、要么沦为劫道的野人。你力气大、性子直，也背着一身说不清的债。你厌恶被叫作「怪物」，却也不得不靠拳头讨生活。最近，一支溃散的兽人小队找上你，说北边出现了「大酋长的血旗」，所有流散的兽人都该回去——可那面旗，三十年前就该烧掉了。",
      "requiredRace": "兽人"
    },
    {
      "name": "人鱼浅海民",
      "description": "你是珍珠群岛浅海的人鱼，靠采珠与渔猎为生，离潮汐王座的宫廷很远。你能歌、善游，也通几分海语的奥秘。海国虽以潮汐为律，浅海民的日子却并不轻松——珍珠的收成要看海神玛瑞斯的脸色，还要躲开噬血鱼群与深海来的东西。这一天，你在珊瑚丛里救起一个溺水的陆上人，他醒来后对你说了一句话，用的竟是最古老的海语：「海神没有消失，它只是睡了。」",
      "requiredRace": "人鱼"
    }
  ]
},
